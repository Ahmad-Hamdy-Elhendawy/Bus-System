<!DOCTYPE html>
<html>
<head>
    <title>Purchase Successful</title>
    <style>
        body { font-family: Arial; max-width: 500px; margin: 50px auto; padding: 20px; text-align: center; }
        .code { font-size: 28px; font-weight: bold; letter-spacing: 3px; background: #f0f0f0; padding: 20px; margin: 20px 0; word-break: break-all; }
        button { padding: 10px 20px; background: green; color: white; border: none; cursor: pointer; }
        .note { color: gray; margin-top: 30px; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Payment Successful!</h1>
    <p>Your ticket has been created.</p>
    <div class="code" id="ticketCode">Check your email for ticket code</div>
    <p>Show this code to the bus driver.</p>
    <p>The driver will scan it from your screen.</p>
    <button onclick="window.location.href='index.html'">Buy Another Ticket</button>
    <div class="note">Ticket expires 24 hours from purchase. One-time use only.</div>
</body>
</html>
